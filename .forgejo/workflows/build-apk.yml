name: build-apk
on:
  push:
    branches: [wh3000]
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    steps:
      - name: Install docker CLI (node:lts job talks to the dind sidecar)
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y -qq docker.io >/dev/null
          docker version
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: pkgsrc
      - name: Build luci-app-5gmodem apk in the OpenWrt SDK
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/out"
          docker run --rm \
            -v "$GITHUB_WORKSPACE/pkgsrc":/pkgsrc -v "$GITHUB_WORKSPACE/out":/out \
            docker.io/openwrt/sdk:mediatek-filogic-25.12.5 bash -c '
              set -eux
              chown -R buildbot /builder /out
              su buildbot -c "
                cd /builder
                cp feeds.conf.default feeds.conf
                echo src-link fivegmodem /pkgsrc >> feeds.conf
                ./scripts/feeds update -a >/dev/null 2>&1
                ./scripts/feeds install -p fivegmodem luci-app-5gmodem
                echo CONFIG_PACKAGE_luci-app-5gmodem=y >> .config
                make defconfig >/dev/null 2>&1
                make package/luci-app-5gmodem/compile -j\$(nproc)
                find bin/packages -name 'luci-app-5gmodem*.apk' -exec cp -v {} /out/ ';'
              "
            '
          ls -la "$GITHUB_WORKSPACE/out/"
      - name: Upload apk
        uses: actions/upload-artifact@v3
        with:
          name: luci-app-5gmodem-apk
          path: out/*.apk
