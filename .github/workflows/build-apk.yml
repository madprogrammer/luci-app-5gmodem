name: build-apk
on:
  push:
    branches: [wh3000]
  workflow_dispatch:

env:
  SDK_URL: https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  PKG: luci-app-5gmodem

jobs:
  build:
    runs-on: ubuntu-latest   # GitHub-hosted: default user 'runner' is non-root (OpenWrt refuses root)
    steps:
      - name: Install OpenWrt build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential file wget unzip zstd git python3 rsync \
            libncurses-dev zlib1g-dev gawk gettext libssl-dev >/dev/null

      - name: Checkout package
        uses: actions/checkout@v7
        with:
          path: pkgsrc

      - name: Cache OpenWrt SDK tree
        id: sdkcache
        uses: actions/cache@v6
        with:
          path: sdk
          key: sdk2-25.12.5-filogic-${{ hashFiles('pkgsrc/**/Makefile') }}
          restore-keys: |
            sdk2-25.12.5-filogic-

      - name: Download + extract the OpenWrt SDK (only when not restored)
        if: hashFiles('sdk/rules.mk') == ''
        run: |
          set -eux
          wget -qO /tmp/sdk.tar.zst "$SDK_URL"
          mkdir -p sdk
          zstd -dc /tmp/sdk.tar.zst | tar -x -C sdk --strip-components=1

      - name: Normalize mtimes on the restored tree
        if: hashFiles('sdk/build_dir/host/.prereq-build') != '' || hashFiles('sdk/staging_dir/host/bin/apk') != ''
        run: |
          set -eu
          # actions/cache does not guarantee mtimes, so a restored dep's .built stamp can read
          # as older than its (also-restored) sources → OpenWrt needlessly recompiles it (bit
          # 5gmodem's glib2/libqmi/modemmanager chain). Make every source OLD, then every build
          # stamp NEWER → make treats cached deps as up-to-date. Our own package still rebuilds:
          # its source lives in pkgsrc/ (outside sdk/, mtime = checkout time = newest).
          find sdk -exec touch -d @1000000000 {} + 2>/dev/null || true
          find sdk/build_dir sdk/staging_dir \
            \( -name '.built' -o -name '.prepared*' -o -name '.configured*' -o -name '.installed*' \) \
            -exec touch -d @1100000000 {} + 2>/dev/null || true

      - name: Build the apk
        run: |
          set -eux
          cd sdk
          cp feeds.conf.default feeds.conf
          echo "src-link pkg $GITHUB_WORKSPACE/pkgsrc" >> feeds.conf
          if [ -d feeds/luci ] && [ -d feeds/packages ]; then
            ./scripts/feeds update pkg >/dev/null 2>&1
          else
            ./scripts/feeds update -a >/dev/null 2>&1
          fi
          ./scripts/feeds install -p pkg "$PKG"
          echo "CONFIG_PACKAGE_$PKG=y" >> .config
          make defconfig >/dev/null 2>&1
          make package/$PKG/compile -j$(nproc)
          mkdir -p "$GITHUB_WORKSPACE/out"
          find bin/packages -name "$PKG*.apk" -exec cp -v {} "$GITHUB_WORKSPACE/out/" ";"

      - name: Upload apk artifact
        uses: actions/upload-artifact@v7
        with:
          name: luci-app-5gmodem-apk
          path: out/*.apk
